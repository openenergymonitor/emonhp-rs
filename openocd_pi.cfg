# OpenOCD configuration for flashing the attached STM32C031 from a Raspberry Pi.
#
# SWD wiring on the Raspberry Pi 40-pin header:
#   SWDIO: physical pin 36, BCM GPIO16
#   SWCLK: physical pin 38, BCM GPIO20
#   GND:   connect a Raspberry Pi ground pin to target ground
#
# Example:
#   openocd -f openocd_pi.cfg \
#       -c "program target/thumbv6m-none-eabi/release/emonhp-rs verify reset exit"
#
# Raspberry Pi 5 exposes header GPIO through RP1, so it uses linuxgpiod.
# Raspberry Pi 0-4 use the native bcm2835gpio driver.
#
# If your Raspberry Pi 5 header GPIO chip is not gpiochip4, override it before
# loading this file, for example:
#   openocd -c "set GPIOD_CHIP 4" -f openocd_pi.cfg ...

set PI_MODEL "unknown"
if {[file exists /proc/device-tree/model]} {
    set model_file [open /proc/device-tree/model r]
    set PI_MODEL [read $model_file]
    close $model_file
}

if {[string match "*Raspberry Pi 5*" $PI_MODEL]} {
    if {![info exists GPIOD_CHIP]} {
        set GPIOD_CHIP 4
    }

    adapter driver linuxgpiod
    adapter gpio swdio -chip $GPIOD_CHIP 16
    adapter gpio swclk -chip $GPIOD_CHIP 20
} else {
    adapter driver bcm2835gpio
    adapter gpio swdio -chip 0 16
    adapter gpio swclk -chip 0 20
}

transport select swd
adapter speed 1000

set CHIPNAME STM32C031K6

if {[catch {source [find target/stm32c0x.cfg]}]} {
    source [find target/stm32g0x.cfg]
}

init
reset halt
